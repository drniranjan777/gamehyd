openapi: 3.1.0
info:
  title: Real-World Battle Royale Platform API
  version: 0.8.0
  description: |
    Player-facing and game-server-facing API (BRD v1.2 §10). Source of truth for request/response shapes:
    TypeScript types are generated from this file and every API test validates responses against it.
    All errors use the `ErrorEnvelope` shape. Authenticated player endpoints take `Authorization: Bearer <accessToken>`.
    `/internal/*` endpoints are for match servers only and require an HMAC signature (see `ServerSignature`).
    `/admin/*` endpoints are for the admin portal and take `Authorization: Admin <token>` from `/admin/auth/login`.
    `/webhooks/*` endpoints are for Google Play and the App Store; each checks the platform's own signature.
servers:
  - url: /api/v1

tags:
  - name: Health
  - name: Auth
  - name: Player
  - name: Maps
  - name: Matchmaking
  - name: Matches
  - name: Inventory
  - name: Reports
  - name: Internal
  - name: Store
  - name: Webhooks
  - name: Public
  - name: Admin
  - name: Telemetry
  - name: Seasons

paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness
      responses:
        '200':
          description: Process is up
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /health/ready:
    get:
      tags: [Health]
      summary: Readiness (database reachable and migrated)
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
        '503': { $ref: '#/components/responses/Error' }

  /auth/guest:
    post:
      tags: [Auth]
      summary: Create a guest account, or sign in with stored guest credentials
      description: |
        Send an empty body on first launch: the response includes `guest.deviceId` and `guest.deviceSecret`, which the
        client must keep in secure storage. Later sign-ins send them back. The secret is shown only once.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GuestSignInRequest' }
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/platform:
    post:
      tags: [Auth]
      summary: Sign in with Google Play Games or Apple Game Center
      description: Not available until platform verification credentials are configured (returns 501).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlatformSignInRequest' }
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '501': { $ref: '#/components/responses/Error' }
  /auth/token/refresh:
    post:
      tags: [Auth]
      summary: Rotate a refresh token
      description: Each refresh token works once. Reusing an old one revokes every session from that sign-in.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: New token pair
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke a refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '204': { description: Revoked (also when already revoked or unknown) }

  /player/profile:
    get:
      tags: [Player]
      security: [{ bearer: [] }]
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '401': { $ref: '#/components/responses/Error' }
    patch:
      tags: [Player]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileUpdate' }
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /player/stats:
    get:
      tags: [Player]
      security: [{ bearer: [] }]
      responses:
        '200':
          description: Lifetime stats
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Stats' }
        '401': { $ref: '#/components/responses/Error' }
  /player/matches:
    get:
      tags: [Player]
      security: [{ bearer: [] }]
      summary: Match history, newest first
      parameters:
        - { name: cursor, in: query, schema: { type: string, maxLength: 200 } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 50, default: 20 },
          }
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MatchHistoryPage' }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /maps:
    get:
      tags: [Maps]
      responses:
        '200':
          description: Published map versions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/MapSummary' }
  /maps/{mapKey}/manifest:
    get:
      tags: [Maps]
      parameters:
        - {
            name: mapKey,
            in: path,
            required: true,
            schema: { type: string, pattern: '^[a-z0-9-]{3,40}$' },
          }
      responses:
        '200':
          description: Latest published version's manifest
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MapManifest' }
        '404': { $ref: '#/components/responses/Error' }

  /matchmaking/queue:
    post:
      tags: [Matchmaking]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QueueRequest' }
      responses:
        '200':
          description: Queued or already matched
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueueStatus' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503':
          {
            description: Matchmaking paused by the kill switch (MATCHMAKING_DISABLED),
            content:
              { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } },
          }
    delete:
      tags: [Matchmaking]
      security: [{ bearer: [] }]
      responses:
        '204': { description: Left the queue (no-op when not queued) }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /matchmaking/status:
    get:
      tags: [Matchmaking]
      security: [{ bearer: [] }]
      description: Poll every 1–2 s while queued. When matched, contains a fresh single-use seat ticket.
      responses:
        '200':
          description: Current state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueueStatus' }
        '401': { $ref: '#/components/responses/Error' }

  /matches/{matchId}/reconnect-ticket:
    post:
      tags: [Matches]
      security: [{ bearer: [] }]
      parameters:
        - { name: matchId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Short-lived single-use seat for a match the player belongs to
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Seat' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /matches/{matchId}/result:
    get:
      tags: [Matches]
      security: [{ bearer: [] }]
      parameters:
        - { name: matchId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Final result (participants only)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MatchResult' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /inventory:
    get:
      tags: [Inventory]
      security: [{ bearer: [] }]
      responses:
        '200':
          description: Owned cosmetics, loadout and wallet balances
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Inventory' }
        '401': { $ref: '#/components/responses/Error' }
  /inventory/loadout/{slot}:
    put:
      tags: [Inventory]
      security: [{ bearer: [] }]
      parameters:
        - {
            name: slot,
            in: path,
            required: true,
            schema: { $ref: '#/components/schemas/CosmeticKind' },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [cosmeticKey]
              properties:
                cosmeticKey: { type: string, pattern: '^[a-z0-9_]{3,60}$' }
      responses:
        '200':
          description: Updated inventory
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Inventory' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /reports:
    post:
      tags: [Reports]
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportRequest' }
      responses:
        '201':
          description: Report filed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Report' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /reports/{reportId}:
    get:
      tags: [Reports]
      security: [{ bearer: [] }]
      parameters:
        - { name: reportId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: A report the player filed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Report' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /internal/game-servers/heartbeat:
    post:
      tags: [Internal]
      security: [{ serverSignature: [] }]
      description: Match servers call this every ~2 s. The response may assign the next match to host.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HeartbeatRequest' }
      responses:
        '200':
          description: Registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HeartbeatResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /internal/matches/{matchId}/result:
    post:
      tags: [Internal]
      security: [{ serverSignature: [] }]
      description: |
        Final result from the hosting match server. Idempotent: resubmitting the identical payload returns 200 with
        `duplicate: true`; a different payload for a completed match is a 409. Rewards are granted exactly once.
      parameters:
        - { name: matchId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResultSubmission' }
      responses:
        '200':
          description: Accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultAccepted' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /store/catalog:
    get:
      tags: [Store]
      security: [{ bearer: [] }]
      description: Products on sale now, with the player's ownership. Empty while the store kill switch is off.
      responses:
        '200':
          {
            description: Catalogue,
            content: { application/json: { schema: { $ref: '#/components/schemas/Catalog' } } },
          }
        '401': { $ref: '#/components/responses/Error' }
  /store/orders:
    post:
      tags: [Store]
      security: [{ bearer: [] }]
      description: |
        Creates an order. Coin/gem products (`IN_GAME`) are paid and granted in this call (status FULFILLED). Real-money
        products return a PENDING order with the platform `sku`; the client buys it in the store, then calls verify.
        Idempotent per `idempotencyKey`: repeating a request returns the same order.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/OrderRequest' } } }
      responses:
        '201':
          {
            description: Order,
            content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } },
          }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    get:
      tags: [Store]
      security: [{ bearer: [] }]
      responses:
        '200':
          {
            description: The player's orders newest first,
            content: { application/json: { schema: { $ref: '#/components/schemas/OrderList' } } },
          }
        '401': { $ref: '#/components/responses/Error' }
  /store/orders/{orderId}:
    get:
      tags: [Store]
      security: [{ bearer: [] }]
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          {
            description: Order,
            content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } },
          }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /store/orders/{orderId}/verify:
    post:
      tags: [Store]
      security: [{ bearer: [] }]
      description: |
        Sends the platform purchase proof (Google Play purchase token, StoreKit 2 signed transaction, or a dev receipt).
        The server verifies it with the platform and grants exactly once. Retrying is safe. A proof already used for
        another order is a 409 `RECEIPT_ALREADY_USED`; a forged or mismatched one is a 422 `RECEIPT_REJECTED`.
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PurchaseProof' } } }
      responses:
        '200':
          {
            description: Fulfilled order,
            content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } },
          }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /store/restore:
    post:
      tags: [Store]
      security: [{ bearer: [] }]
      description: Restores a platform purchase the game never confirmed (crash after paying, reinstall).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RestoreRequest' } } }
      responses:
        '200':
          {
            description: The order the purchase fulfils,
            content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } },
          }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /webhooks/google-play:
    post:
      tags: [Webhooks]
      description: Google Play Real-time developer notifications via Pub/Sub push, authenticated by Google's OIDC token.
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        '200':
          {
            description: Processed or already processed,
            content: { application/json: { schema: { $ref: '#/components/schemas/WebhookAck' } } },
          }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /webhooks/app-store:
    post:
      tags: [Webhooks]
      description: App Store Server Notifications v2 (`signedPayload` JWS verified against the pinned Apple root).
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        '200':
          {
            description: Processed or already processed,
            content: { application/json: { schema: { $ref: '#/components/schemas/WebhookAck' } } },
          }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /webhooks/dev:
    post:
      tags: [Webhooks]
      description: Dev-only refund notifications, signed with `X-RWBR-Dev-Signature` = hex HMAC-SHA256 of the body.
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        '200':
          {
            description: Processed or already processed,
            content: { application/json: { schema: { $ref: '#/components/schemas/WebhookAck' } } },
          }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /player/deletion:
    get:
      tags: [Player]
      security: [{ bearer: [] }]
      responses:
        '200':
          {
            description: Deletion status,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/DeletionStatus' } } },
          }
        '401': { $ref: '#/components/responses/Error' }
    post:
      tags: [Player]
      security: [{ bearer: [] }]
      description: Schedules account deletion after a grace period. Signing in stays possible so the player can cancel.
      responses:
        '202':
          {
            description: Scheduled,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/DeletionStatus' } } },
          }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Player]
      security: [{ bearer: [] }]
      responses:
        '200':
          {
            description: Cancelled,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/DeletionStatus' } } },
          }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /players/{playerId}/public:
    get:
      tags: [Public]
      parameters:
        - { name: playerId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          {
            description: Public profile,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/PublicProfile' } } },
          }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /events:
    get:
      tags: [Public]
      responses:
        '200':
          {
            description: Current and upcoming live events,
            content: { application/json: { schema: { $ref: '#/components/schemas/EventList' } } },
          }
        '429': { $ref: '#/components/responses/Error' }
  /config:
    get:
      tags: [Public]
      responses:
        '200':
          {
            description: Live settings and kill switches in force,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/PublicConfig' } } },
          }
        '429': { $ref: '#/components/responses/Error' }

  /admin/auth/login:
    post:
      tags: [Admin]
      description: Email, password and a 6-digit TOTP code. Five failures lock the account for 15 minutes (423).
      requestBody:
        required: true
        content:
          { application/json: { schema: { $ref: '#/components/schemas/AdminLoginRequest' } } }
      responses:
        '200':
          {
            description: Session,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/AdminSession' } } },
          }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '423': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /admin/auth/logout:
    post:
      tags: [Admin]
      security: [{ admin: [] }]
      responses:
        '204': { description: Signed out }
        '401': { $ref: '#/components/responses/Error' }
  /admin/me:
    get:
      tags: [Admin]
      security: [{ admin: [] }]
      responses:
        '200':
          {
            description: The signed-in admin,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/AdminPrincipal' } } },
          }
        '401': { $ref: '#/components/responses/Error' }
  /admin/overview:
    get:
      tags: [Admin]
      security: [{ admin: [] }]
      responses:
        '200':
          {
            description: Headline numbers,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/AdminOverview' } } },
          }
        '401': { $ref: '#/components/responses/Error' }
  /admin/admins:
    get:
      tags: [Admin]
      security: [{ admin: [] }]
      description: Needs `admins.manage`.
      responses:
        '200':
          {
            description: Admin accounts,
            content: { application/json: { schema: { $ref: '#/components/schemas/AdminList' } } },
          }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [Admin]
      security: [{ admin: [] }]
      description: Needs `admins.manage`. The TOTP secret is returned only in this response.
      requestBody:
        required: true
        content:
          { application/json: { schema: { $ref: '#/components/schemas/AdminCreateRequest' } } }
      responses:
        '201':
          {
            description: Created,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/AdminCreated' } } },
          }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /admin/admins/{adminId}/roles:
    put:
      tags: [Admin]
      security: [{ admin: [] }]
      parameters:
        - { name: adminId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [roles, reason]
              properties:
                roles: { type: array, items: { $ref: '#/components/schemas/AdminRole' } }
                reason: { $ref: '#/components/schemas/Reason' }
