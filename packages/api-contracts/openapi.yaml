                appVersion: { type: string }
                rolloutPercent: { type: integer, minimum: 1, maximum: 100 }
                regions: { type: array, items: { type: string } }
                minCrashFree: { type: number, minimum: 0.9, maximum: 1 }
                minSessions: { type: integer, minimum: 10 }
      responses:
        '201':
          {
            description: Recorded,
            content: { application/json: { schema: { $ref: '#/components/schemas/AppRelease' } } },
          }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /admin/releases/{releaseId}:
    patch:
      tags: [Admin]
      security: [{ admin: [] }]
      parameters:
        - { name: releaseId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                rolloutPercent: { type: integer, minimum: 1, maximum: 100 }
                status: { enum: [ROLLING_OUT, COMPLETE, ROLLED_BACK] }
                reason: { $ref: '#/components/schemas/Reason' }
      responses:
        '200':
          {
            description: Updated,
            content: { application/json: { schema: { $ref: '#/components/schemas/AppRelease' } } },
          }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /admin/seasons:
    get:
      tags: [Admin]
      security: [{ admin: [] }]
      responses:
        '200':
          description: Seasons
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AdminSeason' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [Admin]
      security: [{ admin: [] }]
      description: Needs `liveops.write`. Creates or replaces a DRAFT season and its reward track.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SeasonInput' } } }
      responses:
        '201':
          {
            description: Saved draft,
            content: { application/json: { schema: { $ref: '#/components/schemas/AdminSeason' } } },
          }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /admin/seasons/{key}/publish:
    post:
      tags: [Admin]
      security: [{ admin: [] }]
      description: Publishes a draft; its dates and rewards are then frozen. Published seasons may not overlap (409 SEASON_OVERLAP).
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          {
            description: Published,
            content: { application/json: { schema: { $ref: '#/components/schemas/AdminSeason' } } },
          }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    serverSignature:
      type: apiKey
      in: header
      name: X-RWBR-Signature
      description: |
        hex(HMAC-SHA256(SERVER_SHARED_SECRET, "<timestamp>.<METHOD>.<path>.<hex sha256(body)>")), with the Unix-seconds
        timestamp in `X-RWBR-Timestamp` (must be within 300 s) and the server's address in `X-RWBR-Server`.
    admin:
      type: apiKey
      in: header
      name: Authorization
      description: '`Admin <token>` from /admin/auth/login. Each endpoint also needs the permission it names.'

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  schemas:
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, requestId, details]
          properties:
            code: { type: string, examples: [VALIDATION_ERROR] }
            message: { type: string }
            requestId: { type: [string, 'null'] }
            details:
              type: array
              items:
                type: object
                required: [path, message]
                properties:
                  path: { type: string }
                  message: { type: string }

    Health:
      type: object
      required: [status]
      properties:
        status: { const: ok }
    Readiness:
      type: object
      required: [status, database, schemaVersion]
      properties:
        status: { const: ok }
        database: { const: ok }
        schemaVersion: { type: [string, 'null'] }

    DisplayName:
      type: string
      minLength: 3
      maxLength: 24
      pattern: '^[A-Za-z0-9_. -]+$'

    GuestSignInRequest:
      type: object
      additionalProperties: false
      properties:
        deviceId: { type: string, format: uuid }
        deviceSecret: { type: string, minLength: 43, maxLength: 43, pattern: '^[A-Za-z0-9_-]+$' }
        displayName: { $ref: '#/components/schemas/DisplayName' }
    PlatformSignInRequest:
      type: object
      additionalProperties: false
      required: [provider, token]
      properties:
        provider: { enum: [GOOGLE_PLAY, APPLE] }
        token: { type: string, minLength: 10, maxLength: 4096 }
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken: { type: string, minLength: 43, maxLength: 43 }
    AuthResponse:
      type: object
      additionalProperties: false
      required: [userId, accessToken, accessTokenExpiresIn, refreshToken, refreshTokenExpiresAt]
      properties:
        userId: { type: string, format: uuid }
        accessToken: { type: string }
        accessTokenExpiresIn: { type: integer, description: seconds }
        refreshToken: { type: string }
        refreshTokenExpiresAt: { type: string, format: date-time }
        guest:
          description: Present only when a new guest account was created. Store securely; shown once.
          type: object
          additionalProperties: false
          required: [deviceId, deviceSecret]
          properties:
            deviceId: { type: string, format: uuid }
            deviceSecret: { type: string }

    Profile:
      type: object
      additionalProperties: false
      required: [playerId, displayName, level, xp, xpForNextLevel, createdAt]
      properties:
        playerId: { type: string, format: uuid }
        displayName: { $ref: '#/components/schemas/DisplayName' }
        level: { type: integer, minimum: 1 }
        xp: { type: integer, minimum: 0 }
        xpForNextLevel: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
    ProfileUpdate:
      type: object
      additionalProperties: false
      required: [displayName]
      properties:
        displayName: { $ref: '#/components/schemas/DisplayName' }
    Stats:
      type: object
      additionalProperties: false
      required: [matchesPlayed, wins, kills, winRate, level, xp]
      properties:
        matchesPlayed: { type: integer, minimum: 0 }
        wins: { type: integer, minimum: 0 }
        kills: { type: integer, minimum: 0 }
        winRate: { type: number, minimum: 0, maximum: 1 }
        level: { type: integer, minimum: 1 }
        xp: { type: integer, minimum: 0 }
    MatchHistoryItem:
      type: object
      additionalProperties: false
      required:
        [
          matchId,
          mapVersion,
          mode,
          completedAt,
          placement,
          players,
          kills,
          survivalSeconds,
          xpAwarded,
          coinsAwarded,
        ]
      properties:
        matchId: { type: string, format: uuid }
        mapVersion: { type: string }
        mode: { const: SOLO }
        completedAt: { type: string, format: date-time }
        placement: { type: integer, minimum: 1 }
        players: { type: integer, minimum: 1 }
        kills: { type: integer, minimum: 0 }
        survivalSeconds: { type: integer, minimum: 0 }
        xpAwarded: { type: integer, minimum: 0 }
        coinsAwarded: { type: integer, minimum: 0 }
    MatchHistoryPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MatchHistoryItem' }
        nextCursor: { type: [string, 'null'] }

    MapSummary:
      type: object
      additionalProperties: false
      required: [mapKey, displayName, version, publishedAt]
      properties:
        mapKey: { type: string }
        displayName: { type: string }
        version: { type: string }
        publishedAt: { type: string, format: date-time }
    MapManifest:
      type: object
      additionalProperties: false
      required: [mapKey, version, manifest]
      properties:
        mapKey: { type: string }
        version: { type: string }
        manifest: { type: object }

    QueueRequest:
      type: object
      additionalProperties: false
      required: [mode, region, clientVersion]
      properties:
        mode: { const: SOLO }
        region: { type: string, pattern: '^[A-Z]{2}-[A-Z]{2,10}$', examples: [IN-SOUTH] }
        clientVersion: { type: string, pattern: '^[0-9]+\.[0-9]+\.[0-9]+$' }
        partyId: { type: 'null' }
    Seat:
      type: object
      additionalProperties: false
      required: [matchId, server, ticket, sessionKey, expiresAt, mapVersion]
      properties:
        matchId: { type: string, format: uuid }
        server: { type: string, description: 'host:port of the match server (UDP)' }
        ticket:
          { type: string, contentEncoding: base64, description: 'Signed join ticket (ADR 0007)' }
        sessionKey:
          {
            type: string,
            contentEncoding: base64,
            description: 'Key for packet tags; never send it anywhere',
          }
        expiresAt: { type: string, format: date-time }
        mapVersion: { type: string }
    QueueStatus:
      oneOf:
        - type: object
          additionalProperties: false
          required: [state]
          properties:
            state: { const: IDLE }
        - type: object
          additionalProperties: false
          required: [state, enqueuedAt, region]
          properties:
            state: { const: QUEUED }
            enqueuedAt: { type: string, format: date-time }
            region: { type: string }
        - type: object
          additionalProperties: false
          required: [state, seat]
          properties:
            state: { const: MATCHED }
            seat: { $ref: '#/components/schemas/Seat' }

    MatchResult:
      type: object
      additionalProperties: false
      required: [matchId, status, reason, winnerPlayerId, durationSeconds, mapVersion, participants]
      properties:
        matchId: { type: string, format: uuid }
        status: { const: COMPLETED }
        reason: { enum: [WINNER, TIMEOUT, CANCELLED] }
        winnerPlayerId: { type: [string, 'null'], format: uuid }
        durationSeconds: { type: integer, minimum: 0 }
        mapVersion: { type: string }
        participants:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [playerId, displayName, placement, kills]
            properties:
              playerId: { type: string, format: uuid }
              displayName: { type: string }
              placement: { type: integer, minimum: 1 }
              kills: { type: integer, minimum: 0 }

    CosmeticKind: { enum: [WEAPON_SKIN, OUTFIT, EMOTE, PARACHUTE, BANNER] }
    Inventory:
      type: object
      additionalProperties: false
      required: [items, loadout, wallets]
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [cosmeticKey, kind, displayName, rarity, acquiredAt]
            properties:
              cosmeticKey: { type: string }
              kind: { $ref: '#/components/schemas/CosmeticKind' }
              displayName: { type: string }
              rarity: { enum: [COMMON, RARE, EPIC, LEGENDARY] }
              acquiredAt: { type: string, format: date-time }
        loadout:
          type: object
          additionalProperties: { type: string }
          description: slot -> cosmeticKey
        wallets:
          type: object
          additionalProperties: false
          required: [COIN, GEM]
          properties:
            COIN: { type: integer, minimum: 0 }
            GEM: { type: integer, minimum: 0 }

    ReportRequest:
      type: object
      additionalProperties: false
      required: [reportedPlayerId, reason]
      properties:
        reportedPlayerId: { type: string, format: uuid }
        matchId: { type: string, format: uuid }
        reason: { enum: [CHEATING, HARASSMENT, INAPPROPRIATE_NAME, GRIEFING, OTHER] }
        details: { type: string, maxLength: 1000 }
    Report:
      type: object
      additionalProperties: false
      required: [reportId, reportedPlayerId, matchId, reason, status, createdAt]
      properties:
        reportId: { type: string, format: uuid }
        reportedPlayerId: { type: string, format: uuid }
        matchId: { type: [string, 'null'], format: uuid }
        reason: { enum: [CHEATING, HARASSMENT, INAPPROPRIATE_NAME, GRIEFING, OTHER] }
        status: { enum: [OPEN, UNDER_REVIEW, ACTIONED, DISMISSED] }
        createdAt: { type: string, format: date-time }

    HeartbeatRequest:
      type: object
      additionalProperties: false
      required: [address, region, buildVersion, mapVersions, state]
      properties:
        address: { type: string, pattern: '^[A-Za-z0-9.:-]{3,100}:[0-9]{1,5}$' }
        region: { type: string, pattern: '^[A-Z]{2}-[A-Z]{2,10}$' }
        buildVersion: { type: string, maxLength: 40 }
        mapVersions: { type: array, items: { type: string }, minItems: 1, maxItems: 20 }
        state: { enum: [IDLE, HOSTING] }
        matchId: { type: [string, 'null'], format: uuid }
        matchPhase: { enum: [WAITING, COUNTDOWN, ACTIVE, COMPLETED, null] }
        connectedPlayers: { type: integer, minimum: 0 }
        tickMsP99:
          {
            type: [number, 'null'],
            minimum: 0,
            description: 99th-percentile tick time over the last ~10 s while hosting,
          }
        draining:
          {
            type: boolean,
            description: 'Rolling deploy: take no new matches; unhosted assignments are requeued',
          }
    HeartbeatResponse:
      type: object
      additionalProperties: false
      required: [serverId, assignment]
      properties:
        serverId: { type: string, format: uuid }
        assignment:
          description: A match to host now (only when the server reported IDLE).
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required:
                [matchId, mapVersion, capacity, minPlayers, fillWaitSeconds, disabledWeapons]
              properties:
                matchId: { type: string, format: uuid }
                mapVersion: { type: string }
                capacity: { type: integer, minimum: 2, maximum: 100 }
                minPlayers: { type: integer, minimum: 2 }
                fillWaitSeconds: { type: integer, minimum: 0 }
                disabledWeapons:
                  type: array
                  items: { type: string }
                  description: Weapon catalog ids switched off by live ops; no loot of them spawns in this match.
                lootTable: { $ref: '#/components/schemas/LootTable' }
                fillBots: { type: boolean }
                botDifficulty: { enum: [EASY, NORMAL, HARD] }
    ResultSubmission:
      type: object
      additionalProperties: false
      required: [mapVersion, reason, durationSeconds, participants]
      properties:
        mapVersion: { type: string }
        reason: { enum: [WINNER, TIMEOUT, CANCELLED] }
        winnerAccountId:
          type: [string, 'null']
          format: uuid
          description: The player in 1st place; null when a fill bot won (bots > 0, no listed player 1st).
        durationSeconds: { type: integer, minimum: 0, maximum: 7200 }
        bots:
          type: integer
          minimum: 0
          maximum: 99
          description: Fill bots that played. Not listed; placements and rewards count the whole field.
        participants:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [accountId, placement, kills, survivalSeconds]
            properties:
              accountId: { type: string, format: uuid }
              placement: { type: integer, minimum: 1, maximum: 100 }
              kills: { type: integer, minimum: 0, maximum: 99 }
              survivalSeconds: { type: integer, minimum: 0, maximum: 7200 }
    ResultAccepted:
      type: object
      additionalProperties: false
      required: [matchId, duplicate]
      properties:
        matchId: { type: string, format: uuid }
        duplicate: { type: boolean }

    # ---- Phase 5: store ----
    Money:
      type: object
      additionalProperties: false
      required: [currency, amountMinor]
      description: INR is real money in paise; COIN and GEM are in-game currencies.
      properties:
        currency: { enum: [INR, COIN, GEM] }
        amountMinor: { type: integer, minimum: 1 }
    Grant:
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, cosmeticKey]
          properties:
            type: { const: COSMETIC }
            cosmeticKey: { type: string }
            kind: { $ref: '#/components/schemas/CosmeticKind' }
        - type: object
          additionalProperties: false
          required: [type, currency, amount]
          properties:
            type: { const: CURRENCY }
            currency: { enum: [COIN, GEM] }
            amount: { type: integer, minimum: 1 }
        - type: object
          additionalProperties: false
          required: [type, seasonKey]
          properties:
            type: { const: SEASON_PASS }
            seasonKey: { type: string }
    PlatformSkus:
      type: object
      additionalProperties: false
      properties:
        ANDROID: { type: string }
        IOS: { type: string }
    Catalog:
      type: object
      additionalProperties: false
      required: [storeEnabled, items]
      properties:
        storeEnabled: { type: boolean }
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [productKey, displayName, description, price, grants, skus, owned]
            properties:
              productKey: { type: string }
              displayName: { type: string }
              description: { type: string }
              price: { $ref: '#/components/schemas/Money' }
              grants: { type: array, items: { $ref: '#/components/schemas/Grant' } }
              skus: { $ref: '#/components/schemas/PlatformSkus' }
              owned: { type: boolean }
    OrderPlatform: { enum: [IN_GAME, ANDROID, IOS, DEV] }
    OrderStatus: { enum: [PENDING, VERIFIED, FULFILLED, FAILED, CANCELLED, REFUNDED] }
    OrderRequest:
      type: object
      additionalProperties: false
      required: [productKey, platform, idempotencyKey]
      properties:
        productKey: { type: string, pattern: '^[a-z0-9_]{3,60}$' }
        platform: { $ref: '#/components/schemas/OrderPlatform' }
        idempotencyKey: { type: string, pattern: '^[A-Za-z0-9_:.-]{8,100}$' }
    Order:
      type: object
      additionalProperties: false
      required:
        [orderId, productKey, platform, status, price, sku, createdAt, fulfilledAt, refundedAt]
      properties:
        orderId: { type: string, format: uuid }
        productKey: { type: string }
        platform: { $ref: '#/components/schemas/OrderPlatform' }
        status: { $ref: '#/components/schemas/OrderStatus' }
        price: { $ref: '#/components/schemas/Money' }
        sku: { type: [string, 'null'], description: 'Platform product id to buy; null for IN_GAME' }
        createdAt: { type: string, format: date-time }
        fulfilledAt: { type: [string, 'null'], format: date-time }
        refundedAt: { type: [string, 'null'], format: date-time }
    OrderList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Order' } }
    PurchaseProof:
      type: object
      additionalProperties: false
      required: [proof]
      properties:
        proof: { type: string, minLength: 10, maxLength: 20000 }
    RestoreRequest:
      type: object
      additionalProperties: false
      required: [platform, sku, proof]
      properties:
        platform: { enum: [ANDROID, IOS, DEV] }
        sku: { type: string, pattern: '^[a-z0-9_.]{3,100}$' }
        proof: { type: string, minLength: 10, maxLength: 20000 }
    WebhookAck:
      type: object
      additionalProperties: false
      required: [outcome]
      properties:
        outcome: { enum: [APPLIED, IGNORED, UNMATCHED, REJECTED] }

    # ---- Phase 5: account, public ----
    DeletionStatus:
      type: object
      additionalProperties: false
      required: [status, scheduledFor]
      properties:
        status: { enum: [ACTIVE, SUSPENDED, BANNED, PENDING_DELETION, DELETED] }
        scheduledFor: { type: [string, 'null'], format: date-time }
    PublicProfile:
      type: object
      additionalProperties: false
      required:
        [playerId, displayName, level, matchesPlayed, wins, kills, memberSince, recentMatches]
      properties:
        playerId: { type: string, format: uuid }
        displayName: { type: string }
        level: { type: integer, minimum: 1 }
        matchesPlayed: { type: integer, minimum: 0 }
        wins: { type: integer, minimum: 0 }
        kills: { type: integer, minimum: 0 }
        memberSince: { type: string, format: date-time }
        recentMatches:
          type: array
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required: [matchId, mapVersion, placement, players, kills, completedAt]
            properties:
              matchId: { type: string, format: uuid }
              mapVersion: { type: string }
              placement: { type: integer, minimum: 1 }
              players: { type: integer, minimum: 1 }
              kills: { type: integer, minimum: 0 }
              completedAt: { type: string, format: date-time }
    EventList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [key, title, body, startsAt, endsAt, live]
            properties:
              key: { type: string }
              title: { type: string }
              body: { type: string }
              startsAt: { type: string, format: date-time }
              endsAt: { type: string, format: date-time }
              live: { type: boolean }
    GameConfig:
      type: object
      required: [storeEnabled, matchmakingEnabled, disabledProducts, disabledWeapons]
      properties:
        storeEnabled: { type: boolean }
        matchmakingEnabled: { type: boolean }
        disabledProducts: { type: array, items: { type: string }, maxItems: 200 }
        disabledWeapons: { type: array, items: { type: string }, maxItems: 50 }
        xpMultiplier:
          {
            type: number,
            minimum: 1,
            maximum: 5,
            description: Match XP multiplier for events (default 1),
          }
        lootTable: { $ref: '#/components/schemas/LootTable' }
        fillBots:
          {
            type: boolean,
            description: Fill empty seats with bots when a match starts (default false),
          }
        botDifficulty:
          { enum: [EASY, NORMAL, HARD], description: Skill of fill bots (default NORMAL) }
    LootTable:
      type: object
      description: >-
        Loot weights for matches (Phase C). Shares are percents of the spots of that kind; the rest goes to the last
        option. Sent to the match server with each assignment and from there to every player.
      properties:
        version: { type: integer, minimum: 1 }
        fragPercent: { type: integer, minimum: 0, maximum: 100 }
        smokePercent: { type: integer, minimum: 0, maximum: 100 }
        attachmentPercent: { type: integer, minimum: 0, maximum: 100 }
        lightPercent: { type: integer, minimum: 0, maximum: 100 }
        mediumPercent: { type: integer, minimum: 0, maximum: 100 }
        shellsPercent: { type: integer, minimum: 0, maximum: 100 }
        lightRounds: { type: integer, minimum: 1, maximum: 200 }
        mediumRounds: { type: integer, minimum: 1, maximum: 200 }
        shellRounds: { type: integer, minimum: 1, maximum: 200 }
        heavyRounds: { type: integer, minimum: 1, maximum: 200 }
        bandagePercent: { type: integer, minimum: 0, maximum: 100 }
        medkitPercent: { type: integer, minimum: 0, maximum: 100 }
        bandagesPerSpot: { type: integer, minimum: 1, maximum: 10 }
        vestPercent: { type: integer, minimum: 0, maximum: 100 }
        helmetPercent: { type: integer, minimum: 0, maximum: 100 }
        upgradePercent: { type: integer, minimum: 0, maximum: 100 }
    PublicConfig:
      type: object
      additionalProperties: false
      required:
        [version, storeEnabled, matchmakingEnabled, disabledProducts, disabledWeapons, xpMultiplier]
      properties:
        version: { type: integer, minimum: 1 }
        storeEnabled: { type: boolean }
        matchmakingEnabled: { type: boolean }
        disabledProducts: { type: array, items: { type: string } }
        disabledWeapons: { type: array, items: { type: string } }
        xpMultiplier: { type: number, minimum: 1, maximum: 5 }

    # ---- Phase 5: admin ----
    Reason: { type: string, minLength: 3, maxLength: 500 }
    ReasonRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { $ref: '#/components/schemas/Reason' }
    AdminRole: { enum: [SUPPORT, MODERATOR, ECONOMY_OPERATOR, ANALYST, SUPER_ADMIN] }
    AdminLoginRequest:
      type: object
      additionalProperties: false
      required: [email, password, code]
      properties:
        email: { type: string, format: email }
        password: { type: string }
        code: { type: string, pattern: '^\d{6}$' }
    AdminPrincipal:
      type: object
      additionalProperties: false
      required: [id, email, displayName, roles, permissions, actor]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        displayName: { type: string }
        roles: { type: array, items: { $ref: '#/components/schemas/AdminRole' } }
        permissions: { type: array, items: { type: string } }
        actor: { type: string }
    AdminSession:
      type: object
      additionalProperties: false
      required: [token, expiresAt, admin]
      properties:
        token: { type: string, description: 'Send as `Authorization: Admin <token>`' }
        expiresAt: { type: string, format: date-time }
        admin: { $ref: '#/components/schemas/AdminPrincipal' }
    AdminList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, email, displayName, roles, status, lastLoginAt]
            properties:
              id: { type: string, format: uuid }
              email: { type: string }
              displayName: { type: string }
              roles: { type: array, items: { $ref: '#/components/schemas/AdminRole' } }
              status: { enum: [ACTIVE, DISABLED] }
              lastLoginAt: { type: [string, 'null'], format: date-time }
    AdminCreateRequest:
      type: object
      additionalProperties: false
      required: [email, displayName, password, roles]
      properties:
        email: { type: string, format: email }
        displayName: { type: string, minLength: 1, maxLength: 60 }
        password: { type: string, minLength: 12 }
        roles: { type: array, minItems: 1, items: { $ref: '#/components/schemas/AdminRole' } }
    AdminCreated:
      type: object
      additionalProperties: false
      required: [admin, totpSecret, otpauthUrl]
      properties:
        admin: { $ref: '#/components/schemas/AdminPrincipal' }
        totpSecret: { type: string, description: Base32; shown once }
        otpauthUrl: { type: string }
    AdminOverview:
      type: object
      additionalProperties: false
      required:
        [
          players,
          activePlayers24h,
          matches24h,
          liveMatches,
          serversOnline,
          openReports,
          productsAwaitingApproval,
          pendingOrders,
          revenueInrMinor30d,
          refunds30d,
          walletsWithLedgerDrift,
        ]
      properties:
        players: { type: integer }
        activePlayers24h: { type: integer }
        matches24h: { type: integer }
        liveMatches: { type: integer }
        serversOnline: { type: integer }
        openReports: { type: integer }
        productsAwaitingApproval: { type: integer }
        pendingOrders: { type: integer }
        revenueInrMinor30d: { type: integer }
        refunds30d: { type: integer }
        walletsWithLedgerDrift: { type: integer }
    PlayerStatus: { enum: [ACTIVE, SUSPENDED, BANNED, PENDING_DELETION, DELETED] }
    AdminPlayerList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [playerId, displayName, status, level, createdAt]
            properties:
              playerId: { type: string, format: uuid }
              displayName: { type: string }
              status: { $ref: '#/components/schemas/PlayerStatus' }
              level: { type: integer }
              createdAt: { type: string, format: date-time }
    AdminPlayerDetail:
      type: object
      additionalProperties: false
      required:
        [
          playerId,
          displayName,
          status,
          level,
          xp,
          matchesPlayed,
          wins,
          kills,
          createdAt,
          signIn,
          wallets,
          inventory,
          orders,
          sanctions,
          reports,
        ]
      properties:
        playerId: { type: string, format: uuid }
        displayName: { type: string }
        status: { $ref: '#/components/schemas/PlayerStatus' }
        level: { type: integer }
        xp: { type: integer }
        matchesPlayed: { type: integer }
        wins: { type: integer }
        kills: { type: integer }
        createdAt: { type: string, format: date-time }
        signIn:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [provider, lastUsedAt]
            properties:
              provider: { type: string }
              lastUsedAt: { type: [string, 'null'], format: date-time }
        wallets: { type: object, additionalProperties: { type: integer } }
        inventory:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [cosmeticKey, source]
            properties:
              cosmeticKey: { type: string }
              source: { type: string }
        orders: { type: array, items: { $ref: '#/components/schemas/Order' } }
        sanctions:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, action, reason, expiresAt, by, createdAt]
            properties:
              id: { type: string, format: uuid }
              action: { enum: [WARN, SUSPEND, BAN, UNBAN] }
              reason: { type: string }
              expiresAt: { type: [string, 'null'], format: date-time }
              by: { type: string }
              createdAt: { type: string, format: date-time }
        reports:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [reportId, reason, status, createdAt]
            properties:
              reportId: { type: string, format: uuid }
              reason: { type: string }
              status: { $ref: '#/components/schemas/ReportStatus' }
              createdAt: { type: string, format: date-time }
    SanctionRequest:
      type: object
      additionalProperties: false
      required: [action, reason]
      properties:
        action: { enum: [WARN, SUSPEND, BAN, UNBAN] }
        reason: { $ref: '#/components/schemas/Reason' }
        expiresAt: { type: string, format: date-time }
        reportId: { type: string, format: uuid }
    Sanction:
      type: object
      additionalProperties: false
      required: [id, action, playerStatus, expiresAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        action: { enum: [WARN, SUSPEND, BAN, UNBAN] }
        playerStatus: { $ref: '#/components/schemas/PlayerStatus' }
        expiresAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    AdminMatchList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              [
                matchId,
                status,
                mapVersion,
                region,
                players,
                winnerPlayerId,
                durationSeconds,
                createdAt,
              ]
            properties:
              matchId: { type: string, format: uuid }
              status: { type: string }
              mapVersion: { type: string }
              region: { type: string }
              players: { type: integer }
              winnerPlayerId: { type: [string, 'null'], format: uuid }
              durationSeconds: { type: [integer, 'null'] }
              createdAt: { type: string, format: date-time }
    AdminMatchDetail:
      type: object
      additionalProperties: false
      required:
        [
          matchId,
          status,
          mapVersion,
          server,
          completionReason,
          createdAt,
          endedAt,
          participants,
          resultSubmissions,
        ]
      properties:
        matchId: { type: string, format: uuid }
        status: { type: string }
        mapVersion: { type: string }
        server: { type: string }
        completionReason: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        endedAt: { type: [string, 'null'], format: date-time }
        participants:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [playerId, displayName, placement, kills, survivalSeconds]
            properties:
              playerId: { type: string, format: uuid }
              displayName: { type: string }
              placement: { type: [integer, 'null'] }
              kills: { type: [integer, 'null'] }
              survivalSeconds: { type: [integer, 'null'] }
        resultSubmissions:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [outcome, reason, receivedAt]
            properties:
              outcome: { enum: [ACCEPTED, DUPLICATE, REJECTED] }
              reason: { type: [string, 'null'] }
              receivedAt: { type: string, format: date-time }
    ReportStatus: { enum: [OPEN, UNDER_REVIEW, ACTIONED, DISMISSED] }
    AdminReportList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              [
                reportId,
                reportedPlayerId,
                reportedDisplayName,
                reporterPlayerId,
                matchId,
                reason,
                details,
                status,
                createdAt,
              ]
            properties:
              reportId: { type: string, format: uuid }
              reportedPlayerId: { type: string, format: uuid }
              reportedDisplayName: { type: string }
              reporterPlayerId: { type: [string, 'null'], format: uuid }
              matchId: { type: [string, 'null'], format: uuid }
              reason: { type: string }
              details: { type: [string, 'null'] }
              status: { $ref: '#/components/schemas/ReportStatus' }
              createdAt: { type: string, format: date-time }
    CosmeticList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [cosmeticKey, kind, displayName, rarity]
            properties:
              cosmeticKey: { type: string }
              kind: { $ref: '#/components/schemas/CosmeticKind' }
              displayName: { type: string }
              rarity: { enum: [COMMON, RARE, EPIC, LEGENDARY] }
    ProductStatus: { enum: [DRAFT, PENDING_APPROVAL, PUBLISHED, RETIRED] }
    ProductCreate:
      type: object
      additionalProperties: false
      required: [key, displayName, price, grants]
      properties:
        key: { type: string, pattern: '^[a-z0-9_]{3,60}$' }
        displayName: { type: string, minLength: 1, maxLength: 60 }
        description: { type: string, maxLength: 300 }
        price: { $ref: '#/components/schemas/Money' }
        grants:
          { type: array, minItems: 1, maxItems: 10, items: { $ref: '#/components/schemas/Grant' } }
        skus: { $ref: '#/components/schemas/PlatformSkus' }
        availableFrom: { type: [string, 'null'], format: date-time }
        availableUntil: { type: [string, 'null'], format: date-time }
    ProductPatch:
      type: object
      additionalProperties: false
      properties:
        displayName: { type: string, minLength: 1, maxLength: 60 }
        description: { type: string, maxLength: 300 }
        price: { $ref: '#/components/schemas/Money' }
        grants:
          { type: array, minItems: 1, maxItems: 10, items: { $ref: '#/components/schemas/Grant' } }
        skus: { $ref: '#/components/schemas/PlatformSkus' }
        availableFrom: { type: [string, 'null'], format: date-time }
        availableUntil: { type: [string, 'null'], format: date-time }
    AdminProduct:
      type: object
      additionalProperties: false
      required:
        [
          productKey,
          displayName,
          description,
          price,
          status,
          grants,
          skus,
          availableFrom,
          availableUntil,
          createdBy,
          approvedBy,
          publishedAt,
          updatedAt,
        ]
      properties:
        productKey: { type: string }
        displayName: { type: string }
        description: { type: string }
        price: { $ref: '#/components/schemas/Money' }
        status: { $ref: '#/components/schemas/ProductStatus' }
        grants: { type: array, items: { $ref: '#/components/schemas/Grant' } }
        skus: { $ref: '#/components/schemas/PlatformSkus' }
        availableFrom: { type: [string, 'null'], format: date-time }
        availableUntil: { type: [string, 'null'], format: date-time }
        createdBy: { type: string }
        approvedBy: { type: [string, 'null'] }
        publishedAt: { type: [string, 'null'], format: date-time }
        updatedAt: { type: string, format: date-time }
    AdminProductList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AdminProduct' } }
    AdminOrderList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              [
                orderId,
                productKey,
                platform,
                status,
                price,
                sku,
                createdAt,
                fulfilledAt,
                refundedAt,
                playerId,
              ]
            properties:
              orderId: { type: string, format: uuid }
              productKey: { type: string }
              platform: { $ref: '#/components/schemas/OrderPlatform' }
              status: { $ref: '#/components/schemas/OrderStatus' }
              price: { $ref: '#/components/schemas/Money' }
              sku: { type: [string, 'null'] }
              createdAt: { type: string, format: date-time }
              fulfilledAt: { type: [string, 'null'], format: date-time }
              refundedAt: { type: [string, 'null'], format: date-time }
              playerId: { type: string, format: uuid }
    AdminOrderDetail:
      type: object
      additionalProperties: false
      required:
        [
          orderId,
          productKey,
          platform,
          status,
          price,
          sku,
          createdAt,
          fulfilledAt,
          refundedAt,
          playerId,
          failureReason,
          refundShortfall,
          payment,
          events,
        ]
      properties:
        orderId: { type: string, format: uuid }
        productKey: { type: string }
        platform: { $ref: '#/components/schemas/OrderPlatform' }
        status: { $ref: '#/components/schemas/OrderStatus' }
        price: { $ref: '#/components/schemas/Money' }
        sku: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        fulfilledAt: { type: [string, 'null'], format: date-time }
        refundedAt: { type: [string, 'null'], format: date-time }
        playerId: { type: string, format: uuid }
        failureReason: { type: [string, 'null'] }
        refundShortfall: { type: integer, minimum: 0 }
        payment:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [platform, providerTransactionId, environment, status, verifiedAt]
              properties:
                platform: { enum: [ANDROID, IOS, DEV] }
                providerTransactionId: { type: string }
                environment: { enum: [PRODUCTION, SANDBOX, DEV] }
                status: { enum: [VERIFIED, REFUNDED] }
                verifiedAt: { type: string, format: date-time }
        events:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [type, outcome, detail, receivedAt]
            properties:
              type: { type: string }
              outcome: { enum: [APPLIED, IGNORED, UNMATCHED, REJECTED] }
              detail: { type: [string, 'null'] }
              receivedAt: { type: string, format: date-time }
    RefundResult:
      type: object
      additionalProperties: false
      required:
        [
          orderId,
          productKey,
          platform,
          status,
          price,
          sku,
          createdAt,
          fulfilledAt,
          refundedAt,
          alreadyRefunded,
          shortfall,
        ]
      properties:
        orderId: { type: string, format: uuid }
        productKey: { type: string }
        platform: { $ref: '#/components/schemas/OrderPlatform' }
        status: { $ref: '#/components/schemas/OrderStatus' }
        price: { $ref: '#/components/schemas/Money' }
        sku: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        fulfilledAt: { type: [string, 'null'], format: date-time }
        refundedAt: { type: [string, 'null'], format: date-time }
        alreadyRefunded: { type: boolean }
        shortfall:
          {
            type: integer,
            minimum: 0,
            description: Currency already spent that could not be clawed back,
          }
    ReconcileReport:
      type: object
      additionalProperties: false
      required:
        [
          cancelledPendingOrders,
          walletsWithLedgerDrift,
          unmatchedPurchaseEvents,
          accountsDeleted,
          suspensionsLifted,
          unhostedMatchesCancelled,
          telemetryEventsPurged,
          releasesHalted,
          opsSamplesPurged,
        ]
      properties:
        cancelledPendingOrders: { type: integer }
        walletsWithLedgerDrift: { type: integer }
        unmatchedPurchaseEvents: { type: integer }
        accountsDeleted: { type: integer }
        suspensionsLifted: { type: integer }
        unhostedMatchesCancelled: { type: integer }
        telemetryEventsPurged: { type: integer }
        releasesHalted: { type: integer }
        opsSamplesPurged: { type: integer }
    AuditPage:
      type: object
      additionalProperties: false
      required: [items, nextBefore]
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              [id, actor, action, entityType, entityId, reason, details, requestId, createdAt]
            properties:
              id: { type: integer }
              actor: { type: string }
              action: { type: string }
              entityType: { type: string }
              entityId: { type: string }
              reason: { type: [string, 'null'] }
              details: { type: [object, 'null'] }
              requestId: { type: [string, 'null'] }
              createdAt: { type: string, format: date-time }
        nextBefore: { type: [integer, 'null'] }
    LiveConfig:
      type: object
      additionalProperties: false
      required: [current, history]
      properties:
        current:
          type: object
          additionalProperties: false
          required: [version, config]
          properties:
            version: { type: integer }
            config: { $ref: '#/components/schemas/GameConfig' }
        history:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [version, config, reason, createdBy, createdAt]
            properties:
              version: { type: integer }
              config: { $ref: '#/components/schemas/GameConfig' }
              reason: { type: string }
              createdBy: { type: string }
              createdAt: { type: string, format: date-time }
    EventCreate:
      type: object
      additionalProperties: false
      required: [key, title, startsAt, endsAt]
      properties:
        key: { type: string, pattern: '^[a-z0-9_-]{3,60}$' }
        title: { type: string, minLength: 1, maxLength: 80 }
        body: { type: string, maxLength: 2000 }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
    AdminEvent:
      type: object
      additionalProperties: false
      required: [key, title, body, startsAt, endsAt, status, createdBy]
      properties:
        key: { type: string }
        title: { type: string }
        body: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        status: { enum: [SCHEDULED, CANCELLED] }
        createdBy: { type: string }
    AdminEventList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AdminEvent' } }

    # ---- Phase 6: telemetry and metrics ----
    TelemetryEvent:
      type: object
      required: [type, at, data]
      properties:
        type: { enum: [SESSION_START, SESSION_END, CRASH, FPS_SAMPLE, DISCONNECT] }
        at: { type: string, format: date-time }
        data:
          type: object
          description: |
            SESSION_START {os?, quality?}; SESSION_END {durationSeconds}; CRASH {message, where?, stack?};
            FPS_SAMPLE {avgFps, p5Fps, seconds, scene?, quality?}; DISCONNECT {reason, matchId?, reconnected?}.
    TelemetryBatch:
      type: object
      additionalProperties: false
      required: [sessionId, appVersion, platform, deviceModel, events]
      properties:
        sessionId: { type: string, format: uuid }
        appVersion: { type: string, pattern: '^\d+\.\d+\.\d+$' }
        platform: { enum: [ANDROID, IOS, WINDOWS, MACOS, LINUX, EDITOR] }
        deviceModel: { type: string, minLength: 1, maxLength: 100 }
        events:
          {
            type: array,
            minItems: 1,
            maxItems: 100,
            items: { $ref: '#/components/schemas/TelemetryEvent' },
          }
    Rate: { type: [number, 'null'], minimum: 0, maximum: 1 }
    Retention:
      type: object
      additionalProperties: false
      required: [cohort, retained, rate]
      properties:
        cohort: { type: integer }
        retained: { type: integer }
        rate: { $ref: '#/components/schemas/Rate' }
    Metrics:
      type: object
      additionalProperties: false
      required:
        [
          days,
          generatedAt,
          sessions,
          fpsByDevice,
          matches,
          disconnects,
          queueSeconds,
          retention,
          economy,
          purchaseIntegrity,
          releaseGates,
        ]
      properties:
        days: { type: integer }
        generatedAt: { type: string, format: date-time }
        sessions:
          type: object
          additionalProperties: false
          required: [total, crashed, crashFreeRate]
          properties:
            total: { type: integer }
            crashed: { type: integer }
            crashFreeRate: { $ref: '#/components/schemas/Rate' }
        fpsByDevice:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [platform, deviceModel, samples, avgFps, p5Fps]
            properties:
              platform: { type: string }
              deviceModel: { type: string }
              samples: { type: integer }
              avgFps: { type: number }
              p5Fps: { type: number }
        matches:
          type: object
          additionalProperties: false
          required: [hosted, completed, completionRate]
          properties:
            hosted: { type: integer }
            completed: { type: integer }
            completionRate: { $ref: '#/components/schemas/Rate' }
        disconnects:
          type: object
          additionalProperties: false
          required: [total, reconnected, per100Participations]
          properties:
            total: { type: integer }
            reconnected: { type: integer }
            per100Participations: { type: [number, 'null'] }
        queueSeconds:
          type: object
          additionalProperties: false
          required: [samples, p50, p95]
          properties:
            samples: { type: integer }
            p50: { type: [number, 'null'] }
            p95: { type: [number, 'null'] }
        retention:
          type: object
          additionalProperties: false
          required: [d1, d7]
          properties:
            d1: { $ref: '#/components/schemas/Retention' }
            d7: { $ref: '#/components/schemas/Retention' }
        economy:
          type: object
          additionalProperties: false
          required: [activePlayers, payers, payerConversion, inGameSpenders]
          properties:
            activePlayers: { type: integer }
            payers: { type: integer }
            payerConversion: { $ref: '#/components/schemas/Rate' }
            inGameSpenders: { type: integer }
        purchaseIntegrity:
          type: object
          additionalProperties: false
          required: [duplicateTransactions, paidOrdersWithoutPayment, walletsWithLedgerDrift]
          properties:
            duplicateTransactions: { type: integer }
            paidOrdersWithoutPayment: { type: integer }
            walletsWithLedgerDrift: { type: integer }
        releaseGates:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [key, target, value, status]
            properties:
              key: { type: string }
              target: { type: string }
              value: { type: [number, 'null'] }
              status: { enum: [PASS, FAIL, NO_DATA, MANUAL] }

    # ---- Phase 7: live operations ----
    SeasonReward:
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, cosmeticKey]
          properties:
            type: { const: COSMETIC }
            cosmeticKey: { type: string }
        - type: object
          additionalProperties: false
          required: [type, currency, amount]
          properties:
            type: { const: CURRENCY }
            currency: { enum: [COIN, GEM] }
            amount: { type: integer, minimum: 1 }
    SeasonPass:
      type: object
      additionalProperties: false
      required: [season]
      properties:
        season:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [key, title, startsAt, endsAt, xpPerTier, maxTier, premiumProductKey]
              properties:
                key: { type: string }
                title: { type: string }
                startsAt: { type: string, format: date-time }
                endsAt: { type: string, format: date-time }
                xpPerTier: { type: integer }
                maxTier: { type: integer }
                premiumProductKey: { type: [string, 'null'] }
        progress:
          type: object
          additionalProperties: false
          required: [xp, tier, premium, xpToNextTier]
          properties:
            xp: { type: integer, minimum: 0 }
            tier: { type: integer, minimum: 0 }
            premium: { type: boolean }
            xpToNextTier: { type: integer }
        rewards:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [tier, track, reward, unlocked, claimed]
            properties:
              tier: { type: integer }
              track: { enum: [FREE, PREMIUM] }
              reward: { $ref: '#/components/schemas/SeasonReward' }
              unlocked: { type: boolean }
              claimed: { type: boolean }
    SeasonInput:
      type: object
      additionalProperties: false
      required: [key, title, startsAt, endsAt, xpPerTier, rewards]
      properties:
        key: { type: string, pattern: '^[a-z0-9_-]{3,40}$' }
        title: { type: string, minLength: 1, maxLength: 80 }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        xpPerTier: { type: integer, minimum: 100, maximum: 100000 }
        rewards:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [tier, track, reward]
            properties:
              tier: { type: integer, minimum: 1, maximum: 100 }
              track: { enum: [FREE, PREMIUM] }
              reward: { $ref: '#/components/schemas/SeasonReward' }
    AdminSeason:
      type: object
      additionalProperties: false
      required: [key, title, startsAt, endsAt, xpPerTier, status, createdBy, rewards]
      properties:
        key: { type: string }
        title: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        xpPerTier: { type: integer }
        status: { enum: [DRAFT, PUBLISHED] }
        createdBy: { type: string }
        rewards:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [tier, track, reward]
            properties:
              tier: { type: integer }
              track: { enum: [FREE, PREMIUM] }
              reward: { $ref: '#/components/schemas/SeasonReward' }
    AppRelease:
      type: object
      additionalProperties: false
      required:
        [
          id,
          platform,
          appVersion,
          status,
          rolloutPercent,
          regions,
          minCrashFree,
          minSessions,
          haltReason,
          health,
          createdBy,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        platform: { enum: [ANDROID, IOS] }
        appVersion: { type: string }
        status: { enum: [ROLLING_OUT, HALTED, COMPLETE, ROLLED_BACK] }
        rolloutPercent: { type: integer }
        regions: { type: array, items: { type: string } }
        minCrashFree: { type: number }
        minSessions: { type: integer }
        haltReason: { type: [string, 'null'] }
        health:
          type: object
          additionalProperties: false
          required: [sessions, crashed, crashFreeRate]
          properties:
            sessions: { type: integer }
            crashed: { type: integer }
            crashFreeRate: { $ref: '#/components/schemas/Rate' }
        createdBy: { type: string }
        updatedAt: { type: string, format: date-time }
    LatencyStats:
      type: object
      required: [p50Ms, p95Ms, p99Ms]
      properties:
        p50Ms: { type: [number, 'null'] }
        p95Ms: { type: [number, 'null'] }
        p99Ms: { type: [number, 'null'] }
    OpsDashboard:
      type: object
      additionalProperties: false
      required: [hours, generatedAt, api, servers, capacity, cost]
      properties:
        hours: { type: integer }
        generatedAt: { type: string, format: date-time }
        api:
          type: object
          additionalProperties: false
          required: [requests, serverErrorRate, p50Ms, p95Ms, p99Ms, routes]
          properties:
            requests: { type: integer }
            serverErrorRate: { $ref: '#/components/schemas/Rate' }
            p50Ms: { type: [number, 'null'] }
            p95Ms: { type: [number, 'null'] }
            p99Ms: { type: [number, 'null'] }
            routes:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [route, requests, serverErrors, p50Ms, p95Ms, p99Ms]
                properties:
                  route: { type: string }
                  requests: { type: integer }
                  serverErrors: { type: integer }
                  p50Ms: { type: [number, 'null'] }
                  p95Ms: { type: [number, 'null'] }
                  p99Ms: { type: [number, 'null'] }
        servers:
          type: object
          additionalProperties: false
          required:
            [
              distinctServers,
              serverHours,
              hostingShare,
              tickBudgetMs,
              tickP99Median,
              tickP99Worst,
              minutesOverBudget,
            ]
          properties:
            distinctServers: { type: integer }
            serverHours: { type: number }
            hostingShare: { $ref: '#/components/schemas/Rate' }
            tickBudgetMs: { type: number }
            tickP99Median: { type: [number, 'null'] }
            tickP99Worst: { type: [number, 'null'] }
            minutesOverBudget: { type: integer }
        capacity:
          type: object
          additionalProperties: false
          required: [peakConcurrentPlayers, peakAt, averageConcurrentPlayers, playerHours]
          properties:
            peakConcurrentPlayers: { type: integer }
            peakAt: { type: [string, 'null'], format: date-time }
            averageConcurrentPlayers: { type: number }
            playerHours: { type: number }
        cost:
          type: object
          additionalProperties: false
          required:
            [
              serverCostPerHourInr,
              estimatedInr,
              matchesCompleted,
              perMatchInr,
              perConcurrentPlayerHourInr,
            ]
          properties:
            serverCostPerHourInr: { type: number }
            estimatedInr: { type: number }
            matchesCompleted: { type: integer }
            perMatchInr: { type: [number, 'null'] }
            perConcurrentPlayerHourInr: { type: [number, 'null'] }
    CurrencyFlow:
      type: object
      additionalProperties: false
      required:
        [issued, removed, net, sinkRatio, circulating, holders, medianBalance, p90Balance, byReason]
      properties:
        issued: { type: integer }
        removed: { type: integer }
        net: { type: integer }
        sinkRatio: { type: [number, 'null'] }
        circulating: { type: integer }
        holders: { type: integer }
        medianBalance: { type: number }
        p90Balance: { type: number }
        byReason:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [reason, issued, removed, entries]
            properties:
              reason: { type: string }
              issued: { type: integer }
              removed: { type: integer }
              entries: { type: integer }
    EconomyReport:
      type: object
      additionalProperties: false
      required: [days, generatedAt, currencies, sales, seasons]
      properties:
        days: { type: integer }
        generatedAt: { type: string, format: date-time }
        currencies:
          type: object
          additionalProperties: false
          required: [COIN, GEM]
          properties:
            COIN: { $ref: '#/components/schemas/CurrencyFlow' }
            GEM: { $ref: '#/components/schemas/CurrencyFlow' }
        sales:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [productKey, currency, channel, orders, refunds, grossMinor]
            properties:
              productKey: { type: string }
              currency: { enum: [INR, COIN, GEM] }
              channel: { enum: [IN_GAME, STORE, DEV] }
              orders: { type: integer }
              refunds: { type: integer }
              grossMinor: { type: integer }
        seasons:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [seasonKey, players, premiumPlayers, rewardsClaimed]
            properties:
              seasonKey: { type: string }
              players: { type: integer }
              premiumPlayers: { type: integer }
              rewardsClaimed: { type: integer }
